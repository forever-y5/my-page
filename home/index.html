<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>자기소개 페이지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>자기소개</h1>
        <p>"끊임없이 배우는 개발자입니다."</p>
    </header>

    <nav>
        <a href="#Home" class="active">Home</a>
        <a href="#Skills">Skills</a>
        <a href="#About">About</a>
        <a href="#Contact">Contact</a>
    </nav>

    <div class="container">
        <!-- 왼쪽 메인 영역 -->
        <main class="main-content">
            <section class="intro-box">
                <h2>소개</h2>
                <p>안녕하세요 매일 새로운 기술을 탐구하는 열정적인 개발자입니다.</p>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>동덕여자대학교</h3>
                        <p>대학교</p>
                    </div>
                    <div class="stat-card">
                        <h3>Frontend</h3>
                        <p>주요 관심사</p>
                    </div>
                    <div class="stat-card">
                        <h3>Passion</h3>
                        <p>핵심 역량</p>
                    </div>
                </div>
            </section>

            <!-- 카드 섹션 (포트폴리오, 취미 등) -->
            <div class="item-card">
                    <h3>기술 스택</h3>
                    <p>HTML, CSS, JavaScript</p>
                </div>
                <div class="item-card">
                    <h3>취미 및 특기</h3>
                    <p>코딩, 독서, 운동</p>
                </div>
                <div class="item-card">
                    <h3>앞으로의 목표</h3>
                    <p>성장하는 시니어 개발자</p>
                </div>
            </div>
        </main>
